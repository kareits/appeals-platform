# Continuous integration for the MFO Appeals Platform.
# The quality job runs the same gates as `make check`; the compose-smoke job validates that the
# local stack starts and the demo service is healthy through the reverse proxy.

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    name: Quality gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.30"
          enable-cache: true

      - name: Sync workspace
        run: uv sync --all-packages --dev

      - name: Lint (Ruff)
        run: uv run ruff check .

      - name: Format check (Ruff)
        run: uv run ruff format --check .

      - name: Type check (mypy)
        run: uv run mypy

      - name: Tests (pytest)
        run: uv run pytest

      - name: Docstring coverage (interrogate)
        run: uv run interrogate -c pyproject.toml .

      - name: English Markdown check
        run: uv run python tools/check_english_markdown.py

  iam-postgres-migrations:
    name: IAM PostgreSQL migrations
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: iam_service
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.30"
          enable-cache: true

      - name: Sync workspace
        run: uv sync --all-packages --dev

      - name: Run IAM PostgreSQL migration tests
        env:
          IAM_TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/iam_service
        run: uv run pytest services/iam_service/tests/test_iam_migration_postgres.py -v

  compose-smoke:
    name: Compose smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Start the stack
        run: docker compose -f infrastructure/docker-compose.yml up --build -d --wait --wait-timeout 300

      - name: Check health through the reverse proxy
        run: |
          curl -fsS http://localhost:8080/health/live
          curl -fsS http://localhost:8080/health/ready

      - name: Stop the stack
        if: always()
        run: docker compose -f infrastructure/docker-compose.yml down -v

  flowable-spike:
    name: Flowable spike (integration)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.30"
          enable-cache: true

      - name: Start PostgreSQL and Flowable (published)
        run: >-
          docker compose
          -f infrastructure/docker-compose.yml
          -f infrastructure/docker-compose.spike.yml
          up -d --wait --wait-timeout 300 postgres flowable

      - name: Run the Flowable integration spike
        env:
          PA_FLOWABLE_BASE_URL: http://localhost:8081/flowable-rest/service
          PA_FLOWABLE_USERNAME: rest-admin
          PA_FLOWABLE_PASSWORD: test
        run: |
          uv sync --all-packages --dev
          uv run pytest services/process_adapter -v

      - name: Stop the stack
        if: always()
        run: >-
          docker compose
          -f infrastructure/docker-compose.yml
          -f infrastructure/docker-compose.spike.yml
          down -v
