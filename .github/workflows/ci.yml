# Continuous integration for the MFO Appeals Platform.
# The quality job runs the same gates as `make check`; the compose-smoke job validates that the
# local stack starts and the demo service is healthy through the reverse proxy.

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    name: Quality gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.30"
          enable-cache: true

      - name: Sync workspace
        run: uv sync --all-packages --dev

      - name: Lint (Ruff)
        run: uv run ruff check .

      - name: Format check (Ruff)
        run: uv run ruff format --check .

      - name: Type check (mypy)
        run: uv run mypy

      - name: Tests (pytest)
        run: uv run pytest

      - name: Docstring coverage (interrogate)
        run: uv run interrogate -c pyproject.toml .

      - name: English Markdown check
        run: uv run python tools/check_english_markdown.py

  frontend:
    name: Web frontend gates
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web-frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/web-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (ESLint)
        run: npm run lint

      - name: Format check (Prettier)
        run: npm run format:check

      - name: Type check (tsc)
        run: npm run typecheck

      - name: Tests (Vitest)
        run: npm test

      - name: Build (Vite)
        run: npm run build

      - name: Dependency audit (fail on high/critical)
        # audit-ci wraps `npm audit` with a documented allowlist so a single non-applicable advisory
        # can be waived with an audit trail instead of lowering the whole threshold. See
        # apps/web-frontend/audit-ci.jsonc.
        run: npm run audit:ci

  iam-postgres-migrations:
    name: IAM PostgreSQL migrations
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: iam_service
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.30"
          enable-cache: true

      - name: Sync workspace
        run: uv sync --all-packages --dev

      - name: Run IAM PostgreSQL migration tests
        env:
          IAM_TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/iam_service
        run: uv run pytest services/iam_service/tests/test_iam_migration_postgres.py -v

  ticket-postgres-idempotency:
    name: Ticket PostgreSQL concurrency and migration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          # A dedicated disposable database; the destructive-test guard requires a *_test name.
          POSTGRES_DB: ticket_service_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.30"
          enable-cache: true

      - name: Sync workspace
        run: uv sync --all-packages --dev

      - name: Run ticket PostgreSQL concurrency and populated-migration tests
        env:
          # Opt in explicitly and target only the disposable *_test database.
          ALLOW_DESTRUCTIVE_DATABASE_TESTS: "1"
          TICKET_TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/ticket_service_test
        run: >-
          uv run pytest
          services/ticket_service/tests/test_idempotency_postgres.py
          services/ticket_service/tests/test_migration_postgres.py
          -v

  compose-smoke:
    name: Compose smoke test (authenticated E2E)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Start the stack
        run: docker compose -f infrastructure/docker-compose.yml up --build -d --wait --wait-timeout 300

      - name: Check health through the reverse proxy
        run: |
          curl -fsS http://localhost:8080/health/live
          curl -fsS http://localhost:8080/health/ready

      - name: Authenticated BFF E2E (login, create, workspace, role negatives)
        run: python infrastructure/smoke/bff_e2e_smoke.py http://localhost:8080

      - name: Frontend security and cache headers (through the edge)
        run: |
          # The SPA shell must carry CSP, frame, nosniff, referrer, permissions and revalidation
          # headers; a fingerprinted asset must be immutable (CR-WEB-MEDIUM-003).
          shell=$(curl -fsSI http://localhost:8080/)
          echo "$shell"
          echo "$shell" | grep -qi "content-security-policy: .*frame-ancestors 'none'"
          echo "$shell" | grep -qi "content-security-policy: .*object-src 'none'"
          echo "$shell" | grep -qi "content-security-policy: .*base-uri 'self'"
          echo "$shell" | grep -qi "x-content-type-options: nosniff"
          echo "$shell" | grep -qi "x-frame-options: DENY"
          echo "$shell" | grep -qi "referrer-policy: no-referrer"
          echo "$shell" | grep -qi "permissions-policy:"
          echo "$shell" | grep -qi "cache-control: no-cache"
          asset=$(curl -fsS http://localhost:8080/ | grep -o '/assets/[^"]*\.js' | head -n1)
          test -n "$asset"
          assethdr=$(curl -fsSI "http://localhost:8080${asset}")
          echo "$assethdr"
          echo "$assethdr" | grep -qi "cache-control: public, max-age=31536000, immutable"

      - name: Frontend runtime is non-root (least privilege)
        run: |
          # The SPA container must run as the dedicated non-root user (CR-WEB-LOW-001).
          idout=$(docker compose -f infrastructure/docker-compose.yml exec -T web_frontend id)
          echo "$idout"
          echo "$idout" | grep -q "uid=10001"

      - name: Direct Ticket call must be denied (no gateway bypass)
        run: |
          # Reach the internal Ticket Service directly from another container on the compose network;
          # it must reject an unauthenticated request with 401 even though it has no host port.
          code=$(docker run --rm --network appeals-platform_backend curlimages/curl:8.10.1 \
            -s -o /dev/null -w "%{http_code}" \
            "http://ticket_service:8000/api/v1/tickets/00000000-0000-4000-8000-000000000000")
          echo "direct ticket status: $code"
          test "$code" = "401"

      - name: Stop the stack
        if: always()
        run: docker compose -f infrastructure/docker-compose.yml down -v

  compose-upgrade:
    name: Compose existing-volume upgrade
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Start only PostgreSQL (fresh volume)
        run: docker compose -f infrastructure/docker-compose.yml up -d --wait --wait-timeout 120 postgres

      - name: Simulate a pre-upgrade volume (drop the newer service roles/databases)
        # Each statement is sent as its own psql -c so it runs in its own transaction: DROP DATABASE
        # cannot run inside a transaction block, so combining them in one -c string would fail.
        run: |
          docker compose -f infrastructure/docker-compose.yml exec -T postgres \
            psql -v ON_ERROR_STOP=1 -U postgres -d postgres \
            -c "DROP DATABASE IF EXISTS ticket_service" \
            -c "DROP DATABASE IF EXISTS bff_service" \
            -c "DROP ROLE IF EXISTS ticket" \
            -c "DROP ROLE IF EXISTS bff"

      - name: Bring up the full stack on the existing volume
        run: docker compose -f infrastructure/docker-compose.yml up --build -d --wait --wait-timeout 300

      - name: Health through the reverse proxy (upgrade succeeded without volume recreation)
        run: |
          curl -fsS http://localhost:8080/health/live
          curl -fsS http://localhost:8080/health/ready

      - name: Authenticated E2E after upgrade (not only health)
        run: python infrastructure/smoke/bff_e2e_smoke.py http://localhost:8080

      - name: Rotate to a URI-reserved-character password and re-provision on the retained volume
        env:
          # Contains ':', '@', '/', '?', '#' — reserved in a connection URL; the service builds the
          # URL from discrete parts with percent-encoding, so this must still connect.
          TICKET_DB_PASSWORD: "rot@ted:p/a?ss#9f3a"
        run: |
          # Provisioning must reconcile the existing role's password (not no-op), and the service
          # must authenticate with the rotated special-character secret without recreating the volume.
          docker compose -f infrastructure/docker-compose.yml up -d --wait --wait-timeout 300
          curl -fsS http://localhost:8080/health/ready

      - name: Authenticated E2E after special-character password rotation
        run: python infrastructure/smoke/bff_e2e_smoke.py http://localhost:8080

      - name: Stop the stack
        if: always()
        run: docker compose -f infrastructure/docker-compose.yml down -v

  flowable-spike:
    name: Flowable spike (integration)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.30"
          enable-cache: true

      - name: Start PostgreSQL and Flowable (published)
        run: >-
          docker compose
          -f infrastructure/docker-compose.yml
          -f infrastructure/docker-compose.spike.yml
          up -d --wait --wait-timeout 300 postgres flowable

      - name: Run the Flowable integration spike
        env:
          PA_FLOWABLE_BASE_URL: http://localhost:8081/flowable-rest/service
          PA_FLOWABLE_USERNAME: rest-admin
          PA_FLOWABLE_PASSWORD: test
        run: |
          uv sync --all-packages --dev
          uv run pytest services/process_adapter -v

      - name: Stop the stack
        if: always()
        run: >-
          docker compose
          -f infrastructure/docker-compose.yml
          -f infrastructure/docker-compose.spike.yml
          down -v
