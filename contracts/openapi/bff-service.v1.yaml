openapi: 3.1.0
info:
  title: BFF Service API
  version: "1.0.0"
  description: >-
    Backend-for-Frontend (API gateway) of the MFO Appeals Platform (TASK_01E-1). It is the single
    API the web frontend talks to: it establishes the caller's auth context from the IAM service,
    enforces permission claims at the gateway, aggregates the appeal workspace from downstream
    services, and normalizes errors. It owns no domain data and duplicates no business logic
    (BFF_SERVICE spec). Conventions (docs/05): base path /api/v1, JSON with camelCase fields,
    ISO-8601 UTC timestamps, RFC 7807 Problem Details for errors, X-Correlation-ID propagation.
    Authentication uses the temporary dev/local scheme issued by IAM (docs/06); corporate OIDC
    replaces it later (ADR-AUTH-OIDC, TASK_06). Login and Ticket command/search bodies are forwarded
    verbatim to the upstream services; their transport schemas are projected here exactly from
    iam-service.v1.yaml and ticket-service.v1.yaml so the frontend sees the concrete wire contract
    (required fields, enums, nullability, constraints, additionalProperties). Every response carries
    X-Correlation-ID. Relayed downstream client errors (including 400), the gateway ingress limit
    (413), and gateway transport errors (502/503/504) are all documented. A dereferenced
    cross-contract conformance test keeps this projection in lockstep with the upstream contracts; it
    is a transport projection only, never a shared domain-model library.
servers:
  - url: /api/v1
    description: Versioned base path (mounted by the service).
tags:
  - name: auth
    description: Authentication entry and the caller's resolved auth context.
  - name: tickets
    description: Appeal gateway — search, registration, workspace aggregation, and card commands.
paths:
  /auth/login:
    post:
      tags: [auth]
      operationId: bffLogin
      summary: Authenticate and obtain an access token.
      description: >-
        Forwards the credentials to the IAM dev/local login and relays the signed access token and
        resolved claims. Public (no bearer token required). Available outside production only;
        relays IAM's 403 when dev authentication is disabled. The request body is bounded; an
        oversized body is rejected with 413 before it is forwarded.
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authentication succeeded; an access token is returned.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '413':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        '502':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
        '504':
          $ref: '#/components/responses/Problem'
  /auth/me:
    get:
      tags: [auth]
      operationId: getAuthContext
      summary: Return the caller's auth context.
      description: >-
        Resolves the bearer token against the IAM service and returns the subject, username, roles,
        and permissions the gateway uses for authorization. This is a gateway-owned projection (the
        roles are flattened to their code strings), not a verbatim relay of the IAM subject claims.
        Requires authentication only.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: The caller's resolved auth context.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthContext'
        '401':
          $ref: '#/components/responses/Problem'
        '502':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
        '504':
          $ref: '#/components/responses/Problem'
  /tickets:
    get:
      tags: [tickets]
      operationId: searchTickets
      summary: Search appeals.
      description: >-
        Requires the ticket:read permission. Forwards the query parameters to the Ticket Service
        search and relays the paginated result. The filters and the paginated response projected
        here match ticket-service.v1.yaml exactly.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - {name: registrationNumber, in: query, schema: {type: string}, description: Exact registration number.}
        - {name: identifierValue, in: query, schema: {type: string}, description: Exact national identifier (IIN/BIN) of an attached party.}
        - {name: fullName, in: query, schema: {type: string}, description: Case-insensitive partial match on a party's full name.}
        - {name: contractNumber, in: query, schema: {type: string}, description: Exact related contract number.}
        - {name: statusCode, in: query, schema: {type: string}, description: Current status code.}
        - {name: stageCode, in: query, schema: {type: string}, description: Current stage code.}
        - {name: productCode, in: query, schema: {type: string}, description: Credit-product code.}
        - {name: classifierCode, in: query, schema: {type: string}, description: Question-classifier code.}
        - {name: channelCode, in: query, schema: {type: string}, description: Intake channel code.}
        - {name: assigneeId, in: query, schema: {type: string, format: uuid}, description: Current assignee identifier.}
        - {name: teamId, in: query, schema: {type: string, format: uuid}, description: Current team identifier.}
        - {name: receivedFrom, in: query, schema: {type: string, format: date-time}, description: Inclusive lower bound on receivedAt.}
        - {name: receivedTo, in: query, schema: {type: string, format: date-time}, description: Inclusive upper bound on receivedAt.}
        - {name: registeredFrom, in: query, schema: {type: string, format: date-time}, description: Inclusive lower bound on registeredAt.}
        - {name: registeredTo, in: query, schema: {type: string, format: date-time}, description: Inclusive upper bound on registeredAt.}
        - {name: page, in: query, schema: {type: integer, minimum: 1, default: 1}, description: 1-based page number.}
        - {name: pageSize, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 20}, description: Page size.}
      responses:
        '200':
          description: A page of matching appeals (relayed from the Ticket Service).
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedTickets'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '502':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
        '504':
          $ref: '#/components/responses/Problem'
    post:
      tags: [tickets]
      operationId: createTicket
      summary: Register an appeal.
      description: >-
        Requires the ticket:create permission. Forwards the registration body (and any
        Idempotency-Key header) to the Ticket Service and relays the created appeal card. The request
        body is bounded; an oversized body is rejected with 413 before it is forwarded.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTicketRequest'
      responses:
        '201':
          description: The appeal was registered (relayed from the Ticket Service).
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketResponse'
        '200':
          description: An idempotent replay returned the previously registered appeal.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketResponse'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '413':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        '502':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
        '504':
          $ref: '#/components/responses/Problem'
  /tickets/{ticketId}/workspace:
    get:
      tags: [tickets]
      operationId: getTicketWorkspace
      summary: Aggregate the appeal workspace.
      description: >-
        Requires the ticket:read permission. Aggregates the appeal card and comments from the
        Ticket Service into a single workspace envelope, alongside placeholder sections for the
        process, mail, and documents flows delivered in later phases. Failures are classified, not
        masked: a downstream 401/403 on the card or comments returns 401/403; a non-existent appeal
        returns 404; a card 429 returns 429; a card timeout returns 504; a card connection failure
        returns 503; a card 5xx or malformed body returns 502. Only the optional comments section
        degrades - it is marked unavailable and degraded=true while the rest still returns 200.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/TicketId'
      responses:
        '200':
          description: The aggregated workspace (possibly degraded).
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workspace'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'
        '502':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
        '504':
          $ref: '#/components/responses/Problem'
  /tickets/{ticketId}:
    patch:
      tags: [tickets]
      operationId: updateTicket
      summary: Update editable appeal-card details.
      description: >-
        Requires the ticket:update permission. Forwards the partial update to the Ticket Service and
        relays the updated card. Status, stage, assignee, and team are not editable here. The request
        body is bounded; an oversized body is rejected with 413 before it is forwarded.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/TicketId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTicketRequest'
      responses:
        '200':
          description: The updated appeal card (relayed from the Ticket Service).
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketResponse'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '413':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        '502':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
        '504':
          $ref: '#/components/responses/Problem'
  /tickets/{ticketId}/classify:
    post:
      tags: [tickets]
      operationId: classifyTicket
      summary: Set an appeal's classification.
      description: >-
        Requires the ticket:classify permission. Forwards the classification to the Ticket Service
        and relays the reclassified card. The request body is bounded; an oversized body is rejected
        with 413 before it is forwarded.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/TicketId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClassifyRequest'
      responses:
        '200':
          description: The reclassified appeal card (relayed from the Ticket Service).
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketResponse'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '413':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        '502':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
        '504':
          $ref: '#/components/responses/Problem'
  /tickets/{ticketId}/decision:
    post:
      tags: [tickets]
      operationId: recordDecision
      summary: Record the decision on an appeal.
      description: >-
        Requires the ticket:decide permission. Forwards the decision to the Ticket Service and
        relays the updated card. The request body is bounded; an oversized body is rejected with 413
        before it is forwarded.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/TicketId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecordDecisionRequest'
      responses:
        '200':
          description: The appeal card with the recorded decision (relayed from the Ticket Service).
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketResponse'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '413':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        '502':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
        '504':
          $ref: '#/components/responses/Problem'
  /tickets/{ticketId}/close:
    post:
      tags: [tickets]
      operationId: closeTicket
      summary: Close an appeal.
      description: >-
        Requires the ticket:close permission. Forwards the closure request to the Ticket Service and
        relays the closed card. The Ticket Service enforces the regulatory close prerequisites. The
        request body is bounded; an oversized body is rejected with 413 before it is forwarded.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/TicketId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CloseTicketRequest'
      responses:
        '200':
          description: The closed appeal card (relayed from the Ticket Service).
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketResponse'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '413':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        '502':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
        '504':
          $ref: '#/components/responses/Problem'
  /tickets/{ticketId}/legal-hold:
    post:
      tags: [tickets]
      operationId: setLegalHold
      summary: Set or clear the legal hold on an appeal.
      description: >-
        Requires the ticket:legal_hold permission. Forwards the legal-hold request to the Ticket
        Service and relays the updated card. The request body is bounded; an oversized body is
        rejected with 413 before it is forwarded.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/TicketId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LegalHoldRequest'
      responses:
        '200':
          description: The appeal card with the updated legal-hold flag (relayed from Ticket Service).
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketResponse'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '413':
          $ref: '#/components/responses/Problem'
        '502':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
        '504':
          $ref: '#/components/responses/Problem'
  /tickets/{ticketId}/comments:
    post:
      tags: [tickets]
      operationId: addComment
      summary: Add a comment to an appeal.
      description: >-
        Requires the ticket:comment permission. Forwards the comment to the Ticket Service and
        relays the created comment. The request body is bounded; an oversized body is rejected with
        413 before it is forwarded.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/TicketId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommentRequest'
      responses:
        '201':
          description: The created comment (relayed from the Ticket Service).
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommentResponse'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '413':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        '502':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
        '504':
          $ref: '#/components/responses/Problem'
  /reference-data:
    get:
      tags: [tickets]
      operationId: listReferenceData
      summary: List active reference-dictionary entries.
      description: >-
        Requires the ticket:read permission. Forwards the request to the Ticket Service and relays
        the active reference-dictionary entries (channel, product, classifier, priority, and so on)
        used to populate form controls. The response projected here matches ticket-service.v1.yaml
        exactly.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - name: types
          in: query
          required: false
          schema: {type: string}
          description: >-
            Optional comma-separated dictionary types to include (for example,
            "product,classifier,priority,channel"). When omitted, all active entries are returned.
      responses:
        '200':
          description: The active reference-dictionary entries (relayed from the Ticket Service).
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReferenceDataResponse'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '502':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
        '504':
          $ref: '#/components/responses/Problem'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Signed access token issued by POST /auth/login.
  parameters:
    TicketId:
      name: ticketId
      in: path
      required: true
      schema: {type: string, format: uuid}
      description: Internal appeal identifier (UUIDv7).
    CorrelationId:
      name: X-Correlation-ID
      in: header
      required: false
      schema: {type: string}
      description: Correlation identifier propagated across services; generated when absent.
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema: {type: string, maxLength: 200}
      description: Optional key making the registration retry-safe (forwarded to the Ticket Service).
  headers:
    CorrelationId:
      schema: {type: string}
      description: Correlation identifier for this request (added to every response).
  responses:
    Problem:
      description: An RFC 7807 Problem Details error.
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    # --- Gateway-owned response shapes (no upstream verbatim relay) ---
    AuthContext:
      type: object
      description: The caller's resolved auth context used by the gateway for authorization.
      required: [subject, username, roles, permissions]
      properties:
        subject: {type: string, format: uuid, description: The subject's identifier.}
        username: {type: string, description: The subject's login handle.}
        roles:
          type: array
          items: {type: string}
          description: The subject's granted roles (flattened to their code strings by the gateway).
        permissions:
          type: array
          items: {type: string}
          description: The subject's resolved permission claims.
    Workspace:
      type: object
      description: The aggregated appeal workspace with per-section status.
      required: [ticketId, degraded, sections]
      properties:
        ticketId: {type: string, format: uuid, description: The appeal identifier.}
        degraded:
          type: boolean
          description: True when the optional comments section could not be read; critical/auth failures are not degraded but returned as errors.
        sections:
          $ref: '#/components/schemas/WorkspaceSections'
    WorkspaceSections:
      type: object
      description: The workspace sections aggregated for the appeal.
      required: [ticket, comments, process, mail, documents]
      properties:
        ticket:
          $ref: '#/components/schemas/WorkspaceSection'
        comments:
          $ref: '#/components/schemas/WorkspaceSection'
        process:
          $ref: '#/components/schemas/WorkspaceSection'
        mail:
          $ref: '#/components/schemas/WorkspaceSection'
        documents:
          $ref: '#/components/schemas/WorkspaceSection'
    WorkspaceSection:
      type: object
      description: >-
        A single workspace section. "ok" carries the read data; "unavailable" flags a partial read
        failure with null data; "not_implemented" marks a placeholder for a later phase.
      required: [status, data]
      properties:
        status:
          type: string
          enum: [ok, unavailable, not_implemented]
          description: The read status of the section.
        data:
          description: The section payload when status is "ok"; null otherwise.
          nullable: true
    Problem:
      type: object
      description: RFC 7807 Problem Details.
      required: [title, status]
      properties:
        type: {type: string, default: 'about:blank'}
        title: {type: string}
        status: {type: integer}
        detail: {type: [string, "null"]}
        instance: {type: [string, "null"]}
    # --- Transport projection of iam-service.v1.yaml (POST /auth/login is relayed verbatim) ---
    Role:
      type: string
      description: A platform role assignable to a user.
      enum:
        [EMPLOYEE, SUPERVISOR, FIRST_LINE_READONLY, OMBUDSMAN, ANALYST, ADMIN, AUDITOR]
    LoginRequest:
      type: object
      additionalProperties: false
      required: [username, password]
      properties:
        username: {type: string, minLength: 1, maxLength: 255, description: Login handle.}
        password: {type: string, minLength: 1, maxLength: 72, description: Plaintext password (dev/local scheme).}
    TokenResponse:
      type: object
      description: A signed access token and the claims it carries.
      required: [accessToken, tokenType, expiresIn, subject, username, roles, permissions, teams]
      properties:
        accessToken: {type: string, description: The signed JWT access token.}
        tokenType: {type: string, enum: [Bearer], description: The token type (always Bearer).}
        expiresIn: {type: integer, description: Token lifetime in seconds.}
        subject: {type: string, format: uuid, description: The authenticated user's identifier.}
        username: {type: string, description: The authenticated user's login handle.}
        roles:
          type: array
          items: {$ref: '#/components/schemas/Role'}
          description: The user's granted roles.
        permissions:
          type: array
          items: {type: string}
          description: Permission claims resolved from the user's roles.
        teams:
          type: array
          items: {type: string, format: uuid}
          description: Identifiers of the teams the user belongs to.
    # --- Transport projection of ticket-service.v1.yaml (commands/search are relayed verbatim) ---
    ApplicantInput:
      type: object
      additionalProperties: false
      description: A party attached to an appeal. All demographic fields are optional (docs/01).
      required: [applicantType, dataSource]
      properties:
        applicantType: {type: string, enum: [CONSUMER, REPRESENTATIVE], description: Party role.}
        fullName: {type: [string, "null"], minLength: 1, maxLength: 512, description: Full name.}
        identifierType: {type: [string, "null"], enum: [IIN, BIN, null], description: Identifier kind.}
        identifierValue: {type: [string, "null"], minLength: 1, maxLength: 64, description: National identifier (sensitive; masked in outputs).}
        email: {type: [string, "null"], minLength: 1, maxLength: 512, description: Contact email.}
        phone: {type: [string, "null"], minLength: 1, maxLength: 64, description: Contact phone.}
        genderCode: {type: [string, "null"], minLength: 1, maxLength: 64, description: Gender code.}
        birthDate: {type: [string, "null"], format: date, description: Date of birth.}
        age: {type: [integer, "null"], description: Age in years.}
        regionCode: {type: [string, "null"], minLength: 1, maxLength: 64, description: Region code.}
        dataSource: {type: string, enum: [APPEAL, CORE_SYSTEM, MANUAL], description: Provenance of the data.}
        representativeBasis: {type: [string, "null"], minLength: 1, maxLength: 512, description: Legal basis for a representative.}
    CreateTicketRequest:
      type: object
      additionalProperties: false
      required:
        [receivedAt, sourceChannelCode, subject, description, productCode, classifierCode,
         priorityCode, applicant]
      properties:
        receivedAt: {type: string, format: date-time, description: When the appeal was received.}
        sourceChannelCode: {type: string, minLength: 1, maxLength: 64, description: Intake channel code.}
        subject: {type: string, minLength: 1, maxLength: 512, description: Short subject line.}
        description: {type: string, minLength: 1, description: Full appeal text.}
        productCode: {type: string, minLength: 1, maxLength: 64, description: Credit-product code.}
        classifierCode: {type: string, minLength: 1, maxLength: 64, description: Question-classifier code.}
        priorityCode: {type: string, minLength: 1, maxLength: 64, description: Priority code.}
        contractNumber: {type: [string, "null"], minLength: 1, maxLength: 64, description: Related credit-contract number.}
        applicant: {$ref: '#/components/schemas/ApplicantInput'}
        representative:
          oneOf:
            - {$ref: '#/components/schemas/ApplicantInput'}
            - {type: 'null'}
          description: Optional representative party.
        isConfidential: {type: boolean, default: false, description: Restrict the appeal to the confidential-access role subset.}
    UpdateTicketRequest:
      type: object
      additionalProperties: false
      description: Partial update; only supplied fields change. Status/stage/assignment are excluded.
      required: [expectedVersion]
      properties:
        expectedVersion: {type: integer, minimum: 1, description: Version the client last observed.}
        subject: {type: [string, "null"], minLength: 1, maxLength: 512, description: New subject line.}
        description: {type: [string, "null"], minLength: 1, description: New appeal text.}
        sourceChannelCode: {type: [string, "null"], minLength: 1, maxLength: 64, description: New intake channel code.}
        contractNumber: {type: [string, "null"], minLength: 1, maxLength: 64, description: New related contract number (null clears it).}
    ClassifyRequest:
      type: object
      additionalProperties: false
      required: [expectedVersion, productCode, classifierCode, priorityCode]
      properties:
        expectedVersion: {type: integer, minimum: 1, description: Version the client last observed.}
        productCode: {type: string, minLength: 1, maxLength: 64, description: Credit-product code.}
        classifierCode: {type: string, minLength: 1, maxLength: 64, description: Question-classifier code.}
        priorityCode: {type: string, minLength: 1, maxLength: 64, description: Priority code.}
    RecordDecisionRequest:
      type: object
      additionalProperties: false
      description: >-
        Records a decision. The deciding employee is derived server-side from the authenticated
        caller and is not part of the request (trusted actor).
      required: [expectedVersion, decisionCode, decisionText]
      properties:
        expectedVersion: {type: integer, minimum: 1, description: Version the client last observed.}
        decisionCode: {type: string, minLength: 1, maxLength: 64, description: Decision code (dictionary 'decision').}
        decisionSummary: {type: [string, "null"], minLength: 1, maxLength: 512, description: Short decision summary.}
        decisionText: {type: string, minLength: 1, description: Full decision text.}
    CloseTicketRequest:
      type: object
      additionalProperties: false
      description: >-
        Closes an appeal. Requires a prior decision and a closure reason; a response date OR a
        recorded reason for its absence must be supplied (docs/01).
      required: [expectedVersion, closureReasonCode]
      properties:
        expectedVersion: {type: integer, minimum: 1, description: Version the client last observed.}
        closureReasonCode: {type: string, minLength: 1, maxLength: 64, description: Closure-reason code (dictionary 'closure_reason').}
        responseSentAt: {type: [string, "null"], format: date-time, description: When the response was sent, if any.}
        noResponseReason: {type: [string, "null"], minLength: 1, maxLength: 512, description: Justification when no response was sent.}
    LegalHoldRequest:
      type: object
      additionalProperties: false
      required: [expectedVersion, legalHold]
      properties:
        expectedVersion: {type: integer, minimum: 1, description: Version the client last observed.}
        legalHold: {type: boolean, description: Whether the ticket is under legal hold.}
        reason: {type: [string, "null"], description: Optional reason recorded in the audit log.}
    CommentRequest:
      type: object
      additionalProperties: false
      description: >-
        Adds a comment. The author is derived server-side from the authenticated caller and is not
        part of the request (trusted actor).
      required: [body]
      properties:
        body: {type: string, minLength: 1, description: Comment text.}
    ApplicantResponse:
      type: object
      description: A party as returned by the API; the national identifier is masked.
      required: [id, applicantType, dataSource]
      properties:
        id: {type: string, format: uuid}
        applicantType: {type: string, enum: [CONSUMER, REPRESENTATIVE]}
        fullName: {type: [string, "null"]}
        identifierType: {type: [string, "null"], enum: [IIN, BIN, null]}
        identifierMasked: {type: [string, "null"], description: Masked national identifier.}
        email: {type: [string, "null"]}
        phone: {type: [string, "null"]}
        genderCode: {type: [string, "null"]}
        birthDate: {type: [string, "null"], format: date}
        age: {type: [integer, "null"]}
        regionCode: {type: [string, "null"]}
        dataSource: {type: string, enum: [APPEAL, CORE_SYSTEM, MANUAL]}
        representativeBasis: {type: [string, "null"]}
    TicketResponse:
      type: object
      description: The appeal card.
      required:
        [id, registrationNumber, receivedAt, registeredAt, sourceChannelCode, subject, description,
         productCode, classifierCode, priorityCode, currentStatusCode, currentStageCode, legalHold,
         isConfidential, version, applicants]
      properties:
        id: {type: string, format: uuid}
        registrationNumber: {type: string}
        receivedAt: {type: string, format: date-time}
        registeredAt: {type: string, format: date-time}
        sourceChannelCode: {type: string}
        subject: {type: string}
        description: {type: string}
        productCode: {type: string}
        classifierCode: {type: string}
        priorityCode: {type: string}
        currentStatusCode: {type: string}
        currentStageCode: {type: string}
        currentTeamId: {type: [string, "null"], format: uuid}
        currentAssigneeId: {type: [string, "null"], format: uuid}
        contractNumber: {type: [string, "null"]}
        legalDueAt: {type: [string, "null"], format: date-time}
        internalDueAt: {type: [string, "null"], format: date-time}
        slaPolicyVersion: {type: [string, "null"], description: Version of the SLA policy that computed the deadlines.}
        decisionCode: {type: [string, "null"]}
        decisionSummary: {type: [string, "null"]}
        decisionText: {type: [string, "null"]}
        decisionAt: {type: [string, "null"], format: date-time}
        decisionBy: {type: [string, "null"], format: uuid}
        closureReasonCode: {type: [string, "null"]}
        closedAt: {type: [string, "null"], format: date-time}
        responseSentAt: {type: [string, "null"], format: date-time}
        noResponseReason: {type: [string, "null"]}
        retentionUntil: {type: [string, "null"], format: date}
        legalHold: {type: boolean}
        isConfidential: {type: boolean, description: Whether the appeal is restricted to the confidential-access role subset.}
        version: {type: integer}
        applicants:
          type: array
          items: {$ref: '#/components/schemas/ApplicantResponse'}
    TicketSummary:
      type: object
      description: A compact appeal representation for search results.
      required:
        [id, registrationNumber, subject, currentStatusCode, currentStageCode, productCode,
         classifierCode, priorityCode, receivedAt, registeredAt]
      properties:
        id: {type: string, format: uuid}
        registrationNumber: {type: string}
        subject: {type: string}
        currentStatusCode: {type: string}
        currentStageCode: {type: string}
        productCode: {type: string}
        classifierCode: {type: string}
        priorityCode: {type: string}
        contractNumber: {type: [string, "null"]}
        currentAssigneeId: {type: [string, "null"], format: uuid}
        currentTeamId: {type: [string, "null"], format: uuid}
        receivedAt: {type: string, format: date-time}
        registeredAt: {type: string, format: date-time}
    PageMeta:
      type: object
      required: [page, pageSize, total]
      properties:
        page: {type: integer, description: 1-based page number.}
        pageSize: {type: integer, description: Page size.}
        total: {type: integer, description: Total matching appeals.}
    PaginatedTickets:
      type: object
      required: [items, page]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/TicketSummary'}
        page: {$ref: '#/components/schemas/PageMeta'}
    CommentResponse:
      type: object
      required: [id, ticketId, authorId, body, createdAt]
      properties:
        id: {type: string, format: uuid}
        ticketId: {type: string, format: uuid}
        authorId: {type: string, format: uuid}
        body: {type: string}
        createdAt: {type: string, format: date-time}
    ReferenceEntry:
      type: object
      description: A single active reference-dictionary entry used to populate form controls.
      required: [dictionaryType, code, displayNameRu, sortOrder]
      properties:
        dictionaryType: {type: string, description: The dictionary this entry belongs to (such as product).}
        code: {type: string, description: Stable code stored on the ticket.}
        displayNameRu: {type: string, description: Russian display label (business content).}
        displayNameKk: {type: [string, "null"], description: Kazakh display label (business content) when defined.}
        sortOrder: {type: integer, description: Presentation ordering hint within the dictionary.}
    ReferenceDataResponse:
      type: object
      description: The active reference-dictionary entries, ordered by type, sort order, then code.
      required: [entries]
      properties:
        entries:
          type: array
          items: {$ref: '#/components/schemas/ReferenceEntry'}
