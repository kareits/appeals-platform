# Ticket Service — regulatory registry and appeal card for the MFO Appeals Platform.
# Owns the ticket model, applicants/representatives, reference dictionaries, and the business
# registration number (TASK_01A). Scaffolded from services/demo_service.

[project]
name = "ticket-service"
version = "0.1.0"
description = "Regulatory registry and appeal card (ticket model, applicants, dictionaries)."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "aiosqlite>=0.20",
    "asyncpg>=0.30",
    "aio-pika>=9.4",
    "mfo-observability",
    "mfo-http",
]

[dependency-groups]
dev = [
    "mfo-testing",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ticket_service"]
