# IAM Service — users, roles, teams, and the authorization matrix for the MFO Appeals Platform.
# Owns identity data and issues permission claims for downstream services (TASK_01D).
# Dev/local authentication is available outside production only (docs/06). Scaffolded from
# services/demo_service.

[project]
name = "iam-service"
version = "0.1.0"
description = "Identity, roles, teams, and the authorization matrix (dev/local auth, permission claims)."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "aiosqlite>=0.20",
    "asyncpg>=0.30",
    "bcrypt>=4.1",
    "pyjwt>=2.9",
    "mfo-observability",
    "mfo-http",
]

[dependency-groups]
dev = [
    "mfo-testing",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/iam_service"]
