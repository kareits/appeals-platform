# Process Adapter service (TASK_00D technical spike).
# Isolates the platform from the Flowable REST API. In this phase it has no own database and only
# validates the integration loop; the domain adapter is built in EP-3.

[project]
name = "process-adapter"
version = "0.1.0"
description = "Domain adapter over the Flowable REST API (technical spike in TASK_00D)."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "mfo-observability",
    "mfo-http",
]

[dependency-groups]
dev = [
    "mfo-testing",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/process_adapter"]
