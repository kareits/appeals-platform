# Demonstration service and reference template for MFO Appeals Platform services.
# It exercises the shared libraries, health endpoints, configuration, persistence, and Alembic
# migrations so new services can be scaffolded by copying this layout.

[project]
name = "demo-service"
version = "0.1.0"
description = "Bootstrap demonstration service and reference template for platform services."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "aiosqlite>=0.20",
    "mfo-observability",
    "mfo-http",
]

[dependency-groups]
dev = [
    "mfo-testing",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/demo_service"]
