# Document Service — the platform's file boundary (TASK_03A-1).
# Owns document metadata and the stored bytes; other services reference a document by identifier
# only (root CLAUDE.md data ownership, ADR-014). Scaffolded from services/ticket_service.

[project]
name = "document-service"
version = "0.1.0"
description = "Document metadata and file storage boundary (upload, download, listing, linkage)."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "aiosqlite>=0.20",
    "asyncpg>=0.30",
    "pyjwt>=2.9",
    # Multipart uploads are parsed by Starlette's form parser, which requires python-multipart.
    "python-multipart>=0.0.9",
    "mfo-observability",
    "mfo-http",
]

[dependency-groups]
dev = [
    "mfo-testing",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/document_service"]
