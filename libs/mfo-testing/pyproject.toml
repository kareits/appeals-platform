# Shared testing helpers: pytest fixtures and contract-test utilities.
# Scope is bounded by ADR-007 (technical test support only, no domain or business logic).

[project]
name = "mfo-testing"
version = "0.1.0"
description = "Shared testing helpers (fixtures, contract utilities) for platform services."
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mfo_testing"]
