# Root workspace configuration for the MFO Appeals Platform monorepo.
# This is a uv virtual (non-package) project that owns the shared tool configuration
# (Ruff, mypy, interrogate, pytest) and declares the workspace members.

[project]
name = "mfo-appeals-platform"
version = "0.0.0"
description = "MFO Appeals Platform monorepo root (uv workspace virtual project)."
requires-python = ">=3.12"
dependencies = []

[tool.uv]
package = false

[tool.uv.workspace]
members = [
    "libs/mfo-observability",
    "libs/mfo-http",
    "libs/mfo-testing",
    "services/demo_service",
]

[tool.uv.sources]
mfo-observability = { workspace = true }
mfo-http = { workspace = true }
mfo-testing = { workspace = true }

[dependency-groups]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "interrogate>=1.7",
    "httpx>=0.27",
    "aiosqlite>=0.20",
]

# --- Ruff: linting, import sorting, and docstring enforcement (ADR-015) ---
[tool.ruff]
target-version = "py312"
line-length = 100
src = ["libs", "services", "tools"]
extend-exclude = ["chatgpt_docs", ".venv"]

[tool.ruff.lint]
# D = pydocstyle (docstrings), N = naming, B = bugbear, UP = pyupgrade, I = isort.
select = ["E", "F", "I", "N", "UP", "B", "D"]
# D203/D213 conflict with the Google convention defaults (D211/D212); disable the conflicting pair.
ignore = ["D203", "D213"]

[tool.ruff.lint.pydocstyle]
convention = "google"

# --- mypy: strict static typing (Alembic migration internals excluded, see ADR-015) ---
[tool.mypy]
python_version = "3.12"
strict = true
namespace_packages = true
explicit_package_bases = true
files = ["libs", "services", "tools"]
mypy_path = [
    "libs/mfo-observability/src",
    "libs/mfo-http/src",
    "libs/mfo-testing/src",
    "services/demo_service/src",
]
exclude = ['(^|/)migrations/']

# --- interrogate: docstring coverage gate, target 100% for maintained code ---
[tool.interrogate]
fail-under = 100
ignore-init-method = false
ignore-init-module = false
ignore-magic = false
ignore-nested-functions = false
ignore-private = false
ignore-semiprivate = false
ignore-property-decorators = false
ignore-setters = false
exclude = ["chatgpt_docs", ".venv", "**/build", "**/dist"]

# --- pytest ---
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["libs", "services"]
