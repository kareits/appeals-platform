# Root workspace configuration for the MFO Appeals Platform monorepo.
# This is a uv virtual (non-package) project that owns the shared tool configuration
# (Ruff, mypy, interrogate, pytest) and declares the workspace members.

[project]
name = "mfo-appeals-platform"
version = "0.0.0"
description = "MFO Appeals Platform monorepo root (uv workspace virtual project)."
requires-python = ">=3.12"
dependencies = []

[tool.uv]
package = false

[tool.uv.workspace]
members = [
    "libs/mfo-observability",
    "libs/mfo-http",
    "libs/mfo-testing",
    "services/demo_service",
    "services/process_adapter",
    "services/ticket_service",
    "services/iam_service",
    "services/bff_service",
]

[tool.uv.sources]
mfo-observability = { workspace = true }
mfo-http = { workspace = true }
mfo-testing = { workspace = true }

[dependency-groups]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "interrogate>=1.7",
    "httpx>=0.27",
    "aiosqlite>=0.20",
    "jsonschema>=4.20",
    "types-jsonschema>=4.20",
    "openapi-spec-validator>=0.7",
    "pyyaml>=6.0",
    "types-pyyaml>=6.0",
]

# --- Ruff: linting, import sorting, and docstring enforcement (ADR-015) ---
[tool.ruff]
target-version = "py312"
line-length = 100
src = ["libs", "services", "tools", "contracts"]
extend-exclude = ["chatgpt_docs", ".venv"]

[tool.ruff.lint]
# D = pydocstyle (docstrings), N = naming, B = bugbear, UP = pyupgrade, I = isort.
select = ["E", "F", "I", "N", "UP", "B", "D"]
# D203/D213 conflict with the Google convention defaults (D211/D212); disable the conflicting pair.
ignore = ["D203", "D213"]

[tool.ruff.lint.pydocstyle]
convention = "google"

# --- mypy: strict static typing (Alembic migration internals excluded, see ADR-015) ---
[tool.mypy]
python_version = "3.12"
strict = true
namespace_packages = true
explicit_package_bases = true
files = ["libs", "services", "tools", "contracts"]
mypy_path = [
    "libs/mfo-observability/src",
    "libs/mfo-http/src",
    "libs/mfo-testing/src",
    "services/demo_service/src",
    "services/process_adapter/src",
    "services/ticket_service/src",
    "services/iam_service/src",
    "services/bff_service/src",
]
exclude = ['(^|/)migrations/']

# Some tests share helpers via uniquely named modules in a tests directory (test dirs are not module
# roots for mypy, unlike the per-service ``src``): ``bff_fakes`` for the BFF fakes and
# ``pg_test_safety`` for the destructive-PostgreSQL target guard. The modules are still type-checked;
# this only silences their cross-module import resolution.
[[tool.mypy.overrides]]
module = ["bff_fakes", "pg_test_safety"]
ignore_missing_imports = true

# --- interrogate: docstring coverage gate, target 100% for maintained code ---
[tool.interrogate]
fail-under = 100
ignore-init-method = false
ignore-init-module = false
ignore-magic = false
ignore-nested-functions = false
ignore-private = false
ignore-semiprivate = false
ignore-property-decorators = false
ignore-setters = false
# node_modules holds third-party vendored code (some packages ship .py files, e.g. flatted); it is
# not maintained project code and is excluded from the docstring gate (root CLAUDE.md exclusions).
exclude = ["chatgpt_docs", ".venv", "**/build", "**/dist", "**/node_modules"]

# --- pytest ---
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["libs", "services", "contracts"]
